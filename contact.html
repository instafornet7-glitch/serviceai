<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تواصل معنا — ServiceAI</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<main><section class="section contact-section"><div class="container contact-layout"><div class="contact-info">
<h2>دعنا نبدأ <span class="text-gradient">حوارًا.</span></h2>
<div class="contact-info-card"><strong>البريد الإلكتروني</strong><span>serviceai.102026@gmail.com</span></div>
<div class="contact-info-card"><strong>العنوان</strong><span>سلا، الرباط، المغرب</span></div>
</div>
<form class="contact-form" id="contactForm">
<input id="contact-name" name="name" type="text" required placeholder="اسمك الكريم">
<input id="contact-email" name="email" type="email" required placeholder="name@example.com">
<input id="contact-subject" name="subject" type="text" required placeholder="موضوع رسالتك">
<textarea id="contact-message" name="message" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>
<button type="submit">إرسال الرسالة</button>
<p id="formStatus"></p>
</form></div></section></main>
<script>
const supabaseClient = supabase.createClient("https://ndjtzidrowsjvszhksdb.supabase.co","sb_publishable_l0U0f6V6O4at0Q1k2T5r1g_S3SUpI1o");
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('formStatus'); status.textContent = "جاري الإرسال...";
  const { error } = await supabaseClient.from('contacts').insert([{ name: document.getElementById('contact-name').value, email: document.getElementById('contact-email').value, subject: document.getElementById('contact-subject').value, message: document.getElementById('contact-message').value }]);
  if(error){ status.textContent = "خطأ: " + error.message; } else { status.textContent = "✅ تم الإرسال!"; e.target.reset(); }
});
</script></body></html>
